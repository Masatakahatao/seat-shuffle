<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>席決め管理システム</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* 全体のベース調整（スマホでも文字が小さくなりすぎないようにする） */
        body { 
            font-family: sans-serif; 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 15px; 
            background: #f4f7f6; 
            box-sizing: border-box;
            -webkit-text-size-adjust: 100%;
        }
        
        /* カードの余白をスマホ用に少しスリムに */
        .card { 
            background: white; 
            padding: 15px; 
            border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
            margin-bottom: 15px; 
        }
        
        h1, h2 { color: #333; border-left: 5px solid #2196F3; padding-left: 10px; font-size: 1.4rem; }
        h3 { font-size: 1.1rem; margin-top: 0; }

        /* 入力欄をスマホでもタップ・入力しやすく */
        .input-group { margin: 15px 0; }
        input[type="number"], input[type="text"] { 
            padding: 10px; 
            border: 1px solid #ddd; 
            border-radius: 4px; 
            width: 100%; /* 横幅いっぱいに広げる */
            box-sizing: border-box;
            font-size: 16px; /* iOSでズームされるのを防ぐサイズ */
        }
        
        /* ボタンを「親指サイズ」に大きく、タップしやすく変更 */
        button { 
            padding: 12px 20px; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 15px;
            width: 100%; /* 基本は横幅いっぱい（押しやすさ重視） */
            margin-bottom: 10px; /* ボタン同士がくっつかないように */
            display: block;
            box-sizing: border-box;
            transition: background 0.2s;
        }
        
        /* PCや広い画面ではボタンを横並びにする設定 */
        @media (min-width: 480px) {
            input[type="number"] { width: 100px; }
            input[type="text"] { width: 250px; }
            button { width: auto; display: inline-block; margin-right: 10px; margin-bottom: 0; }
        }

        .btn-primary { background: #2196F3; color: white; }
        .btn-primary:active { background: #1976D2; }
        .btn-secondary { background: #e0e0e0; color: #333; }
        .btn-secondary:active { background: #d5d5d5; }
        .btn-danger { background: #f44336; color: white; margin-top: 15px; }
        .btn-danger:active { background: #d32f2f; }
        
        /* 結果表示の班ごとのスタイル（スマホでも綺麗に並ぶようにGridを採用） */
        #schedule-output {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        
        .result-group {
            background: #eef5f9;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #00bcd4;
        }
        
        /* ヒートマップテーブルがスマホからはみ出しても、横スクロールできるようにする */
        .table-container {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-top: 10px;
            border: 1px solid #eee;
            border-radius: 4px;
        }
        
        #matrix-table { 
            font-size: 12px; 
            border-collapse: collapse; 
            text-align: center; 
            width: 100%;
            min-width: 400px; /* テーブルが潰れすぎないように最低幅を確保 */
        }
        #matrix-table td, #matrix-table th { padding: 6px; border: 1px solid #ddd; }
    </style>
</head>
<body>

    <h1>席決め管理システム</h1>

    <div class="card" style="background: #fff3e0; border-left: 5px solid #ff9800;">
        <p style="margin: 0 0 8px 0; font-size: 0.85rem; font-weight: bold; color: #e65100;">📱 スマホへの移行・過去データの読み込み：</p>
        <button class="btn-secondary" type="button" onclick="document.getElementById('csv-import').click()" style="margin-bottom: 0; background: white; border: 1px solid #ffcc80; color: #e65100;">
            📥 過去の履歴を読み込む (CSV)
        </button>
        <input type="file" id="csv-import" accept=".csv" style="display: none;" onchange="importCSV(this)">
    </div>

    <div id="setup-section" class="card" style="display: none;">
        <h2>初期設定</h2>
        <p>全体の人数と班の数を入力して開始してください。</p>
        <div class="input-group">
            <label>全体の人数 (最大50名): 
                <input type="number" id="playerCount" value="40" min="1" max="50">
            </label>
        </div>
        <div class="input-group">
            <label>班の数: <input type="number" id="groupCount" value="7" min="1" max="50"></label>
        </div>
        <button class="btn-primary" onclick="startOperation()">運用を開始する</button>
    </div>

    <div id="operation-section" class="card" style="display: none;">
        <div id="status-display">読み込み中...</div>
        <hr>
        <div class="input-group">
            <label>本日の欠席者の番号: 
                <input type="text" id="absentPlayers" placeholder="例: 5, 12 (いない場合は空欄)">
            </label>
        </div>
        <button class="btn-primary" onclick="generateSchedule()">本日の席替えを実行</button>
        <br>
        <button class="btn-danger" onclick="resetAllData()">全データをリセットして最初から設定</button>
        <button class="btn-undo" onclick="undoLastAction()">↩️ 1日戻る</button>
    </div>

    <div id="result-area" class="card" style="display: none;">
        <h2>本日の席順</h2>
        <div id="schedule-output"></div>
        
        <div style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px;">
            <button id="edit-btn" class="btn-secondary" onclick="toggleEditMode()">✏️ 座席を編集</button>
            <button id="save-edit-btn" class="btn-primary" style="display:none;" onclick="saveManualEdit()">✅ 編集を確定</button>
            
            <button class="btn-secondary" onclick="copyToClipboard()">📋 結果をコピー</button>
            <button class="btn-secondary" onclick="exportCSV()">📁 CSVエクスポート</button>
        </div>
    </div>

    <div id="debug-section" class="card" style="margin-top: 30px;">
        <h3>遭遇履歴ヒートマップ (デバッグ用)</h3>
        <p style="font-size: 0.8em; color: #666;">※色が濃いほど遭遇回数が多いペアです（8段階表示）</p>
       <div class="table-container">
            <table id="matrix-table" style="font-size: 11px; border-collapse: collapse; text-align: center;"></table>
        </div>
    </div>

    <div id="graphContainer" class="card" style="display:none;">
        <h2>アルゴリズム比較検証</h2>
        <canvas id="labCanvas" width="600" height="400" style="width: 100%;"></canvas>
        <p style="font-size: 0.8em; color: #666;">
            <span style="color: rgba(54, 162, 235, 1);">■</span> SA法 (青) / 
            <span style="color: rgba(255, 99, 132, 1);">■</span> ランダム (赤)
        </p>
    </div>

    <script src="main.js"></script>
</body>
</html>
