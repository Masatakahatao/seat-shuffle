<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>席決め管理システム</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 10px; background: #f4f7f6; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1, h2 { color: #333; border-left: 5px solid #2196F3; padding-left: 10px; }
        .input-group { margin: 15px 0; }
        input[type="number"], input[type="text"] { padding: 8px; border: 1px solid #ddd; border-radius: 4px; width: 100px; }
        input[type="text"] { width: 250px; }
        button { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-primary { background: #2196F3; color: white; }
        .btn-danger { background: #f44336; color: white; margin-top: 20px; }
        .btn-undo { background: #ff9800; color: white; margin-top: 20px; }
        .result-group { display: inline-block; vertical-align: top; margin: 5px; padding: 10px; border: 1px solid #eee; border-radius: 4px; min-width: 120px; }
        #status-display { font-size: 1.2em; color: #1565C0; font-weight: bold; }
    </style>
</head>
<body>

    <h1>席決め管理システム</h1>

    <!-- 1. 初期設定セクション（初回またはリセット時のみ表示） -->
    <div id="setup-section" class="card" style="display: none;">
        <h2>初期設定</h2>
        <p>全体の人数と班の数を入力して開始してください。</p>
        <div class="input-group">
            <label>全体の人数 (最大50名): 
                <input type="number" id="playerCount" value="40" min="1" max="50">
            </label>
        </div>
        <div class="input-group">
            <label>班の数: <input type="number" id="groupCount" value="7" min="1" max="50"></label>
        </div>
        <button class="btn-primary" onclick="startOperation()">運用を開始する</button>
    </div>

    <!-- 2. 運用セクション（2回目以降に表示） -->
    <div id="operation-section" class="card" style="display: none;">
        <div id="status-display">読み込み中...</div>
        <hr>
        <div class="input-group">
            <label>本日の欠席者の番号: 
                <input type="text" id="absentPlayers" placeholder="例: 5, 12 (いない場合は空欄)">
            </label>
        </div>
        <button class="btn-primary" onclick="generateSchedule()">本日の席替えを実行</button>
        <br>
        <button class="btn-danger" onclick="resetAllData()">全データをリセットして最初から設定</button>
        <button class="btn-undo" onclick="undoLastAction()">↩️ 1日戻る</button>
    </div>

    <!-- 3. 結果表示セクション -->
    <div id="result-area" class="card" style="display: none;">
        <h2>本日の席順</h2>
        <div id="schedule-output"></div>
        
        <div style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px;">
            <button id="edit-btn" class="btn-secondary" onclick="toggleEditMode()">✏️ 座席を編集</button>
            <button id="save-edit-btn" class="btn-primary" style="display:none;" onclick="saveManualEdit()">✅ 編集を確定</button>
            
            <button class="btn-secondary" onclick="copyToClipboard()">📋 結果をコピー</button>
            <button class="btn-secondary" onclick="exportCSV()">📁 CSVエクスポート</button>
        </div>
    </div>

    <div id="debug-section" class="card" style="margin-top: 30px;">
        <h3>遭遇履歴ヒートマップ (デバッグ用)</h3>
        <p style="font-size: 0.8em; color: #666;">※色が濃いほど遭遇回数が多いペアです（8段階表示）</p>
        <div style="overflow-x: auto;">
            <table id="matrix-table" style="font-size: 11px; border-collapse: collapse; text-align: center;"></table>
        </div>
    </div>

    <div id="graphContainer" class="card" style="display:none;">
        <h2>アルゴリズム比較検証</h2>
        <canvas id="labCanvas" width="600" height="400" style="width: 100%;"></canvas>
        <p style="font-size: 0.8em; color: #666;">
            <span style="color: rgba(54, 162, 235, 1);">■</span> SA法 (青) / 
            <span style="color: rgba(255, 99, 132, 1);">■</span> ランダム (赤)
        </p>
    </div>

    <script src="main.js"></script>
</body>
</html>
