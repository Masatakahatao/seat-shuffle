<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>席決め管理システム</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* 全体のベース調整（スマホ対応） */
        body { 
            font-family: sans-serif; 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 15px; 
            background: #f4f7f6; 
            box-sizing: border-box;
            -webkit-text-size-adjust: 100%;
        }
        
        .card { 
            background: white; 
            padding: 15px; 
            border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
            margin-bottom: 15px; 
        }
        
        h1, h2 { color: #333; border-left: 5px solid #2196F3; padding-left: 10px; font-size: 1.4rem; }
        h3 { font-size: 1.1rem; margin-top: 0; }

        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
        
        input[type="number"], input[type="text"], textarea { 
            width: 100%; 
            padding: 8px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            box-sizing: border-box;
            font-size: 1rem;
        }

        .btn-primary { 
            background: #2196F3; color: white; border: none; padding: 10px 15px; 
            border-radius: 4px; cursor: pointer; font-size: 1rem; width: 100%; margin-top: 5px;
        }
        .btn-secondary { 
            background: #e0e0e0; color: #333; border: none; padding: 8px 12px; 
            border-radius: 4px; cursor: pointer; font-size: 0.9rem; margin-right: 5px; margin-bottom: 5px;
        }
        
        .result-group { 
            background: #f9f9f9; border: 1px solid #e0e0e0; padding: 10px; 
            margin-bottom: 8px; border-radius: 4px; font-size: 1.1rem;
        }

        .table-container { width: 100%; overflow-x: auto; }
        
        /* スマホ向け2列配置用 */
        .row { display: flex; gap: 10px; }
        .col { flex: 1; }
    </style>
</head>
<body>

    <h1>席決め管理システム</h1>

    <div id="setup-section" class="card" style="display: none;">
        <h2>基本設定</h2>
        <div class="row">
            <div class="col input-group">
                <label for="playerCount">全体の人数 (最大50名)</label>
                <input type="number" id="playerCount" value="40" min="1" max="50">
            </div>
            <div class="col input-group">
                <label for="groupCount">班の数</label>
                <input type="number" id="groupCount" value="7" min="1">
            </div>
        </div>
        <div class="input-group">
            <label for="malePlayerInput">男性プレイヤーの番号 (例: 1-20 または 1,3,5)</label>
            <input type="text" id="malePlayerInput" placeholder="例: 1-20" value="1-20">
        </div>
        <button id="start-btn" class="btn-primary">運用を開始する</button>

        <div style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px;">
            <label style="display:block; margin-bottom:5px; font-weight:bold; font-size:0.9rem;">過去の履歴を読み込む (CSVインポート)</label>
            <input type="file" id="csv-file-input" accept=".csv" style="font-size:0.9rem;">
        </div>
    </div>

    <div id="operation-section" class="card" style="display: none;">
        <h2>席替えの実行</h2>
        <p id="status-display" style="font-weight: bold; color: #666; font-size:0.95rem;"></p>
        
        <div class="input-group">
            <label for="absentPlayers">本日の欠席者番号 (カンマやスペース区切り)</label>
            <input type="text" id="absentPlayers" placeholder="例: 5, 12">
        </div>
        <button id="generate-btn" class="btn-primary">🎲 席替えを実行する</button>
        
        <div style="margin-top: 15px;">
            <button id="reset-btn" class="btn-secondary" style="background:#ffcdd2; color:#b71c1c;">🔄 全データをリセット</button>
        </div>
    </div>

    <div id="result-area" class="card" style="display: none;">
        <h2>本日の席順</h2>
        <div id="schedule-output"></div>
        
        <div style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px;">
            <button id="edit-btn" class="btn-secondary">✏️ 座席を編集</button>
            <button id="save-edit-btn" class="btn-primary" style="display:none; width:auto; padding: 8px 12px;">✅ 編集を確定</button>
            <button id="copy-btn" class="btn-secondary">📋 結果をコピー</button>
            <button id="export-btn" class="btn-secondary">📁 CSVエクスポート</button>
        </div>
    </div>

    <div id="debug-section" class="card" style="margin-top: 30px;">
        <h3>遭遇履歴ヒートマップ</h3>
        <p style="font-size: 0.8em; color: #666;">※色が濃いほど遭遇回数が多いペアです（8段階表示）</p>
        <div class="table-container">
            <table id="matrix-table" style="font-size: 11px; border-collapse: collapse; text-align: center;"></table>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
